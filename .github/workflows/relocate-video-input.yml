name: relocate-video-input
on:
  push:
    branches:
      - cursor/minimal-public-readme-27c9
jobs:
  move:
    if: github.event.head_commit.message != 'Move video-input runtime into product and remove flat package'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/minimal-public-readme-27c9
      - name: Copy runtime into product and drop the flat package
        run: |
          set -euo pipefail
          mkdir -p skills/product/video-input/scripts
          cp skills/video-input/scripts/video_input.py skills/product/video-input/scripts/video_input.py
          test -s skills/product/video-input/scripts/video_input.py
          rm -rf skills/video-input
          rm -f .github/workflows/relocate-video-input.yml
          git config user.name "Zach"
          git config user.email "31757688+zach-sndr@users.noreply.github.com"
          git add -A
          git commit -m "Move video-input runtime into product and remove flat package"
          git push
